<!DOCTYPE html>
<html lang="$if(lang)$$lang$$else$en$endif$" data-scheme="$if(scheme)$$scheme$$else$light$endif$">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="$if(scheme)$$scheme$$else$light$endif$" />
<title>$if(pagetitle)$$pagetitle$$else$$title$$endif$</title>
$for(css)$
<link rel="stylesheet" href="$css$" />
$endfor$
$for(header-includes)$
$header-includes$
$endfor$
</head>
<body>
<main class="markdown-body">
$for(include-before)$
$include-before$
$endfor$
$if(toc)$
<nav id="$idprefix$TOC" role="doc-toc">
$if(toc-title)$
<h2 id="$idprefix$toc-title">$toc-title$</h2>
$endif$
$table-of-contents$
</nav>
$endif$
$body$
$for(include-after)$
$include-after$
$endfor$
</main>
</body>
</html>
